
name: DDS Frontend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dds-frontend-production
  cancel-in-progress: false

jobs:
  build:
    name: Build React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}

      - name: Validate build
        run: |
          test -s dist/index.html
          test -d dist/assets
          echo "Frontend build validated successfully"

      - name: Package build
        run: tar -czf dds-dist.tar.gz -C dist .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dds-production-build
          path: dds-dist.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to Hostinger VPS
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dds-production-build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Transfer build to VPS
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          RELEASE_ID="${GITHUB_SHA:0:12}-${GITHUB_RUN_NUMBER}"
          ARCHIVE="/tmp/dds-${RELEASE_ID}.tar.gz"

          scp -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            dds-dist.tar.gz \
            "${USERNAME}@${HOST}:${ARCHIVE}"

          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "REMOTE_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Deploy frontend
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            "${USERNAME}@${HOST}" \
            "bash /opt/scripts/deploy-dds-frontend.sh '$RELEASE_ID' '$REMOTE_ARCHIVE'"
